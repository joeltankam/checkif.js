language: node_js
sudo: false
node_js:
  - '10'

cache:
  directories:
    - '.eslintcache'
    - 'node_modules'

git:
  depth: 10
branches:
  only:
    - master

install:
  - npm install -g jest
  - npm install -g codacy-coverage
  - npm ci

script:
  # Tests with coverage
  - npm run test-ci
  # Report coverage on codacy. The project token comes from the CODACY_PROJECT_TOKEN
  # environment variable, which holds the encrypted Codacy token of this repository.
  # Skip the upload while that variable is not set, so the build keeps passing.
  - if [ -n "$CODACY_PROJECT_TOKEN" ]; then cat ./coverage/lcov.info | codacy-coverage --projectName checkif.js --verbose; fi
  # Integration tests
  - npm run build
